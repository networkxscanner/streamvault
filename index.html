<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Movies & Anime</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        header h1 {
            margin: 0;
            color: #e50914;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .search-container {
            margin-top: 15px;
        }
        .search-container input {
            width: 80%;
            max-width: 400px;
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #252525;
            color: white;
            outline: none;
        }
        .search-container input:focus {
            border-color: #e50914;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        h2 {
            border-left: 4px solid #e50914;
            padding-left: 10px;
            margin-top: 20px;
            color: #f1f1f1;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .card-info {
            padding: 12px;
            text-align: center;
        }
        .card-info h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #fff;
        }
        .card-info span {
            font-size: 12px;
            color: #aaa;
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>STREAMVAULT</h1>
        <p style="margin: 5px 0 0; color: #888; font-size: 14px;">Your Ultimate Movies & Anime Hub</p>
        
        <!-- Search Bar Section -->
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Search anime or movies...">
        </div>
    </header>

    <div class="container">
        <h2>Trending Anime & Movies</h2>
        <div class="grid" id="cardGrid">
            <!-- Item 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500" alt="Anime Poster">
                <div class="card-info">
                    <h3 class="title">Dark Fantasy Series</h3>
                    <span>Action / Mystery</span>
                </div>
            </div>
            <!-- Item 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500" alt="Movie Poster">
                <div class="card-info">
                    <h3 class="title">Cyberpunk Chronicles</h3>
                    <span>Sci-Fi / Thriller</span>
                </div>
            </div>
            <!-- Item 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" alt="Anime Poster">
                <div class="card-info">
                    <h3 class="title">Lofi & Night Vibes</h3>
                    <span>Aesthetic / Drama</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Live Search -->
    <script>
        function filterCards() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
